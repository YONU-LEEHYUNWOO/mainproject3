[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pyproject.toml or pip install alembic
# If not specified, UTC is used.
# timezone =

# max length of characters to apply to the
# migration filenames.
# revision_environment = false

# set to 'true' to run the environment file as a script, rather than importing it
revision_environment = false

# Controls how many migrations are displayed in the `alembic history` output
truncate_history = false

# default mode for revision_environment
# revision_environment_mode = plain

# specify a hardcoded revision to use as the base for new revisions
# revision_environment_base = base

# set to `true` to have the `alembic revision` command automatically add a
# dependency to the current head revision.
revision_environment_autogenerate_base = true

# set to `true` to have the `alembic upgrade` command automatically create
# the database if it doesn't exist.
# create_db_on_upgrade = false

# set to `true` to have alembic track schema changes to underlying database objects
# such as GRANT/REVOKE and CREATE/DROP of triggers, constraints, indexes, etc.
# track_schema_changes = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S